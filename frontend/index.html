<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Li's Assistance - AI Voice Assistant & Portfolio</title>
    <link rel="stylesheet" href="/static/style.css?v=20261021_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Immediate fallback to prevent any unstyled flash */
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .header-btn { 
            display: inline-flex !important; 
            align-items: center !important; 
            gap: 8px !important; 
            padding: 8px 16px !important; 
            border-radius: 20px !important; 
            font-size: 0.85rem !important; 
            font-weight: 600 !important; 
            text-decoration: none !important; 
            cursor: pointer !important; 
            white-space: nowrap !important;
            transition: all 0.25s ease !important;
        }
        .resume-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.35), rgba(6, 182, 212, 0.35)) !important;
            border: 1px solid rgba(99, 102, 241, 0.6) !important;
            color: #ffffff !important;
        }
        .sound-toggle-btn {
            background: rgba(255, 255, 255, 0.08) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: #f8fafc !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fa-solid me-2 fa-robot"></i>
                <span>Li's Assistance</span>
            </div>
            <div class="header-actions">
                <a href="/static/resume.html" target="_blank" class="header-btn resume-btn" id="resumeBtn" title="View & Download Li's Resume">
                    <i class="fa-solid fa-file-pdf"></i> <span>Resume / CV</span>
                </a>
                <button type="button" class="header-btn sound-toggle-btn" id="soundToggleBtn" title="Toggle Voice Audio Output">
                    <i class="fa-solid fa-volume-high" id="soundIcon"></i>
                    <span id="soundLabel">Sound On</span>
                </button>
                <div class="status-badge" id="statusBadge">
                    <span class="pulse-dot"></span> Ready
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Voice Visualizer -->
            <div class="visualizer-card">
                <div class="voice-orb" id="voiceOrb">
                    <div class="orb-core">
                        <i class="fa-solid fa-microphone" id="micIcon"></i>
                    </div>
                    <div class="wave wave1"></div>
                    <div class="wave wave2"></div>
                    <div class="wave wave3"></div>
                </div>
                <p class="status-text" id="statusText">Click microphone or hold Spacebar to speak with Li</p>
                
                <div class="mic-controls">
                    <button class="mic-btn" id="micBtn" title="Click or Hold Spacebar to Speak">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button class="stop-speech-btn" id="stopSpeechBtn" title="Stop Assistant Speaking (or press Esc)" style="display: none;">
                        <i class="fa-solid fa-stop"></i> <span>Stop Talking</span>
                    </button>
                </div>
            </div>

            <!-- Quick Action Pills (Recruiter & Portfolio Showcase) -->
            <div class="quick-actions">
                <button class="pill-btn primary-pill" data-cmd="Show Li's featured projects and code architecture"><i class="fa-solid fa-rocket"></i> Featured Projects</button>
                <button class="pill-btn" data-cmd="Tell me about Li's 6-month AI internship at INSA"><i class="fa-solid fa-building-columns"></i> INSA Internship</button>
                <button class="pill-btn" data-cmd="What is Li's strongest tech stack for backend and AI roles?"><i class="fa-solid fa-bolt"></i> Tech Stack</button>
                <button class="pill-btn" data-cmd="How can I contact Li for roles or collaborations?"><i class="fa-solid fa-envelope"></i> Contact Li</button>
                <button class="pill-btn" data-cmd="Can I see Li's resume or CV?"><i class="fa-solid fa-file-lines"></i> Resume / CV</button>
                <button class="pill-btn" data-cmd="What are the recent commits on Li's GitHub repositories?"><i class="fa-brands fa-github"></i> Recent Commits</button>
            </div>

            <!-- Chat Container -->
            <div class="chat-container" id="chatContainer">
                <div class="message assistant-message">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        Hi there! I'm here to tell you all about Liche Tsegaye. Feel free to ask me anything!
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer Input Bar -->
        <footer class="footer-input">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Type a message or hold Spacebar to speak..." autocomplete="off">
                <button id="sendBtn" class="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </footer>
    </div>

    <script src="/static/script.js?v=20261021_5"></script>
</body>
</html>
